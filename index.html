<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HK SERVER — Access Authentication</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 24px 18px;
      overflow-x: hidden;
    }

    /* Top Bar */
    .top-bar {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.8px;
    }

    .access-status {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .square-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
    }

    .granted-color { color: #00e5a3; }
    .granted-dot {
      background-color: #00e5a3;
      box-shadow: 0 0 8px #00e5a3;
    }

    .locked-color { color: #ff3366; }
    .locked-dot {
      background-color: #ff3366;
      box-shadow: 0 0 8px #ff3366;
    }

    /* Center Flame/Claw Emblem */
    .center-container {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      width: 100%;
      max-width: 320px;
      margin: auto 0;
    }

    .blue-aura {
      position: absolute;
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, rgba(0, 102, 255, 0.5) 0%, rgba(0, 40, 160, 0.2) 55%, transparent 75%);
      filter: blur(25px);
      border-radius: 50%;
      z-index: 1;
      animation: flamePulse 3s infinite alternate ease-in-out;
    }

    .emblem-svg {
      width: 250px;
      height: 250px;
      z-index: 2;
      filter: drop-shadow(0 0 15px rgba(0, 140, 255, 0.8));
    }

    /* Bottom Cards */
    .bottom-card {
      width: 100%;
      max-width: 400px;
      background-color: #011314;
      border: 1px solid #0d3832;
      border-radius: 20px;
      padding: 22px 18px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.95);
    }

    /* Login Box (Screen 1) */
    .login-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center;
    }

    .key-input {
      width: 100%;
      background: #020b0d;
      border: 1.5px solid #00e5a366;
      border-radius: 12px;
      padding: 14px;
      font-size: 14px;
      color: #00e5a3;
      text-align: center;
      letter-spacing: 2px;
      font-weight: 700;
      outline: none;
      transition: 0.3s;
    }

    .key-input:focus {
      border-color: #00e5a3;
      box-shadow: 0 0 15px rgba(0, 229, 163, 0.3);
    }

    .auth-btn {
      width: 100%;
      background: linear-gradient(90deg, #00b07a, #00e5a3);
      color: #011413;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 229, 163, 0.4);
    }

    .msg-box {
      font-size: 12px;
      font-weight: bold;
      min-height: 18px;
    }

    /* Unlocked Card (Screen 2) */
    .row-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 11px;
    }

    .col-label { color: #00e5a3; }
    .col-value-active { color: #00e5a3; }
    .col-expires-val {
      color: #ffffff;
      font-family: monospace;
      font-size: 13px;
      font-weight: 700;
    }

    .inner-preset-box {
      background-color: #001817;
      border: 1.5px solid #00e5a3;
      border-radius: 14px;
      padding: 16px 14px;
      margin-top: 10px;
    }

    .inner-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .preset-badge {
      background-color: #042e27;
      border: 1px solid rgba(0, 229, 163, 0.35);
      border-radius: 20px;
      color: #00e5a3;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.8px;
      padding: 4px 10px;
    }

    .preset-content {
      color: #ffffff;
      font-size: 11.5px;
      font-weight: 800;
      line-height: 1.55;
      letter-spacing: 0.8px;
    }

    .copy-vless-btn {
      width: 100%;
      background: #022b27;
      border: 1px solid #00e5a3;
      color: #00e5a3;
      font-weight: 800;
      font-size: 12px;
      padding: 12px;
      border-radius: 10px;
      margin-top: 15px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .admin-link {
      color: #3b5f5b;
      font-size: 11px;
      text-decoration: underline;
      cursor: pointer;
      margin-top: 6px;
    }

    @keyframes flamePulse {
      0% { transform: scale(0.92); opacity: 0.6; }
      100% { transform: scale(1.08); opacity: 0.95; }
    }
  </style>
</head>
<body>

  <!-- Top Status Bar -->
  <div class="top-bar">
    <div id="top-status-text" class="access-status locked-color">
      <span id="top-dot" class="square-dot locked-dot"></span>
      ACCESS REQUIRED
    </div>
    <div id="top-lock-status" class="locked-color">LOCKED</div>
  </div>

  <!-- Center Glowing HK SERVER Emblem -->
  <div class="center-container">
    <div class="blue-aura"></div>
    <svg class="emblem-svg" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M150 20L170 85L225 35L200 105L270 80L215 140L285 160L210 185L260 230L185 215L170 280L145 220L115 280L110 215L35 235L85 180L15 155L85 135L25 80L95 105L75 35L130 85L150 20Z" fill="url(#ice_grad)" opacity="0.85"/>
      <path d="M150 40L165 95L210 55L190 115L245 95L205 145L255 165L195 185L235 220L175 210L160 260L145 210L125 255L120 205L55 220L95 175L40 155L95 140L45 95L105 115L90 55L135 95L150 40Z" fill="url(#inner_flame)" opacity="0.95"/>
      <path d="M135 115L142 125L150 112L158 125L165 115L163 130H137L135 115Z" fill="#e2f1ff" stroke="#0099ff" stroke-width="1.5"/>
      
      <!-- Logo Name: HK SERVER -->
      <text x="150" y="170" text-anchor="middle" font-size="34" font-weight="900" font-style="italic" fill="url(#metal_text)" stroke="#0a2a4a" stroke-width="2" letter-spacing="2">
        HK SERVER
      </text>

      <defs>
        <linearGradient id="ice_grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0066ff"/><stop offset="50%" stop-color="#00d4ff"/><stop offset="100%" stop-color="#002288"/>
        </linearGradient>
        <linearGradient id="inner_flame" x1="50%" y1="0%" x2="50%" y2="100%">
          <stop offset="0%" stop-color="#ffffff"/><stop offset="40%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/>
        </linearGradient>
        <linearGradient id="metal_text" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffffff"/><stop offset="45%" stop-color="#e2e8f0"/><stop offset="55%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#ffffff"/>
        </linearGradient>
      </defs>
    </svg>
  </div>

  <!-- Bottom Container -->
  <div class="bottom-card">
    
    <!-- Screen 1: Key Login -->
    <div id="login-section" class="login-box">
      <span style="font-size:12px; color:#55837d; font-weight:800; letter-spacing:1px;">ENTER 24H ACCESS KEY</span>
      <input type="text" id="access-key-input" class="key-input" placeholder="HK-XXXX-XXXX" autocomplete="off" />
      <button class="auth-btn" onclick="verifyKey()">ACTIVATE ACCESS</button>
      <div id="msg" class="msg-box"></div>
      <span class="admin-link" onclick="openAdminGenerator()">⚡ Generate New Key (Admin)</span>
    </div>

    <!-- Screen 2: Active Dashboard -->
    <div id="active-section" style="display: none;">
      <!-- NAME (HK SERVER) Row -->
      <div class="row-item">
        <span class="col-label">NAME</span>
        <span class="col-value-active" style="letter-spacing: 1.5px;">HK SERVER</span>
      </div>

      <div class="row-item">
        <span class="col-label">STATUS</span>
        <span class="col-value-active">ACTIVE</span>
      </div>

      <div class="row-item">
        <span class="col-label">EXPIRES</span>
        <span id="expiry-display" class="col-expires-val">--</span>
      </div>

      <div class="row-item" style="margin-top:14px; margin-bottom:8px;">
        <span style="color:#3f6863; font-size:11.5px; letter-spacing:1.2px;">SELECT PRESET</span>
        <span class="col-value-active">ACTIVE</span>
      </div>

      <div class="inner-preset-box">
        <div class="inner-header">
          <span class="preset-badge">⚡ PRESET 1</span>
          <span style="color:#00e5a3; font-size:11px; font-weight:800;">✓ ACTIVE</span>
        </div>
        <div class="preset-content">
          AIM LIGHT+FREEZE ON FIRE AND SCOPE+ LOCATION+ FAST PICKUP+ WALL FLIP
        </div>
      </div>

      <button class="copy-vless-btn" onclick="copyServerNode()">📋 COPY SERVER LINK FOR HAPP</button>
    </div>

  </div>

<script>
    // आपका VLESS लिंक
    const VLESS_NODE_URL = "vless://331461f0-cd69-11f1-a76a-37da4ed8df4d@crimson-surf-c108.acreater878.workers.dev:443?encryption=none&security=tls&sni=crimson-surf-c108.acreater878.workers.dev&type=ws&host=crimson-surf-c108.acreater878.workers.dev&path=%2F#HK-SERVER";

    // आपका मास्टर पासवर्ड
    const MASTER_KEY = "HK@2005";

    window.onload = function() {
      checkExistingSession();
    };

    function checkExistingSession() {
      const savedExpiry = localStorage.getItem("hk_expiry");
      if (savedExpiry) {
        const expiryTime = parseInt(savedExpiry, 10);
        const currentTime = new Date().getTime();

        if (currentTime < expiryTime) {
          showActiveDashboard(new Date(expiryTime));
        } else {
          localStorage.removeItem("hk_expiry");
        }
      }
    }

    function verifyKey() {
      const input = document.getElementById("access-key-input").value.trim();
      const msg = document.getElementById("msg");

      let validKeys = JSON.parse(localStorage.getItem("hk_keys") || "[]");

      // HK@2005 या जनरेट की गई कोई भी Key
      if (input === MASTER_KEY || validKeys.includes(input.toUpperCase())) {
        msg.style.color = "#00e5a3";
        msg.innerText = "ACCESS GRANTED! Activating HK SERVER...";

        const expiryDate = new Date(new Date().getTime() + 24 * 60 * 60 * 1000);
        localStorage.setItem("hk_expiry", expiryDate.getTime());

        setTimeout(() => {
          showActiveDashboard(expiryDate);
        }, 700);
      } else {
        msg.style.color = "#ff3366";
        msg.innerText = "INVALID OR EXPIRED KEY!";
      }
    }

    function showActiveDashboard(dateObj) {
      document.getElementById("login-section").style.display = "none";
      document.getElementById("active-section").style.display = "block";

      const topText = document.getElementById("top-status-text");
      topText.className = "access-status granted-color";
      topText.innerHTML = '<span class="square-dot granted-dot"></span> ACCESS GRANTED';

      const topLock = document.getElementById("top-lock-status");
      topLock.className = "granted-color";
      topLock.innerText = "UNLOCKED";

      const formattedDate = dateObj.getFullYear() + "-" +
        String(dateObj.getMonth() + 1).padStart(2, '0') + "-" +
        String(dateObj.getDate()).padStart(2, '0') + " " +
        String(dateObj.getHours()).padStart(2, '0') + ":" +
        String(dateObj.getMinutes()).padStart(2, '0') + ":" +
        String(dateObj.getSeconds()).padStart(2, '0');

      document.getElementById("expiry-display").innerText = formattedDate;
    }

    function copyServerNode() {
      navigator.clipboard.writeText(VLESS_NODE_URL).then(() => {
        alert("HK SERVER लिंक कॉपी हो गया! अब Happ ऐप में जाकर '+' दबाकर पेस्ट करें।");
      });
    }

    // एडमिन की जनरेटर (पासवर्ड: HK@2005)
    function openAdminGenerator() {
      const password = prompt("Enter Admin Password:");
      if (password === "HK@2005") {
        const randomCode = "HK-" + Math.random().toString(36).substring(2, 6).toUpperCase() + "-" + Math.random().toString(36).substring(2, 6).toUpperCase();
        
        let keys = JSON.parse(localStorage.getItem("hk_keys") || "[]");
        keys.push(randomCode);
        localStorage.setItem("hk_keys", JSON.stringify(keys));

        alert("नई 24 घंटे की Key बन गई है:\n\n" + randomCode + "\n\nइसे कॉपी करें।");
      } else if (password !== null) {
        alert("गलत पासवर्ड! (Wrong Password)");
      }
    }
  </script>
